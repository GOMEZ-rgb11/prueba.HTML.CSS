<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Formulario</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Formulario de Información</h1>
        
        <form action="#">
            <div class="grupo-input">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="input-focus">
            </div>
            
            <div class="grupo-input">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo">
            </div>
            
            <div class="grupo-input">
                <label for="url">URL:</label>
                <input type="url" id="url" name="url" placeholder="Escribe la URL de tu página web personal">
            </div>
            
            <div class="grupo-input">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha">
            </div>
            
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </div>
</body>
</html>
